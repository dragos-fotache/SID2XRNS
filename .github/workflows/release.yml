name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify the archive without publishing a release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    name: Verify and publish release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sid2xrns-linux
          path: dist/
      - name: Verify the archive checksum
        working-directory: dist
        run: sha256sum --check "SID2XRNS-$VERSION-linux-x86_64.tar.gz.sha256"
      - name: Publish GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="v$VERSION"
          archive="dist/SID2XRNS-$VERSION-linux-x86_64.tar.gz"
          existing_commit=$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" \
            "refs/tags/$tag" "refs/tags/$tag^{}" | awk 'END {print $1}')
          if [[ -n "$existing_commit" && "$existing_commit" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag $tag already points to another commit"
            exit 1
          fi
          gh release create "$tag" "$archive" "$archive.sha256" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "SID2XRNS $VERSION" --generate-notes
