name: Build

on:
  push:
  workflow_call:
    outputs:
      version:
        description: CLI version in the tested archive
        value: ${{ jobs.build.outputs.version }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.10'
      - name: Install pinned test dependencies
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          import sys

          versions = json.loads(Path("docs/reference-lock.json").read_text())["analysis_packages"]
          requirements = [f"{name}=={versions[name]}" for name in ("numpy", "scipy")]
          subprocess.run(
              [sys.executable, "-m", "pip", "install", "--only-binary=:all:", "--no-deps", *requirements],
              check=True,
          )
          PY
      - name: Run the Python test suite
        run: python -m unittest discover -s tests -v
      - name: Package and smoke-test the Linux CLI
        id: package
        shell: bash
        run: |
          version=$(./bin/sid2xrns --version)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a numeric CLI version in major.minor.patch format"
            exit 1
          fi
          directory="SID2XRNS-$version"
          archive="$directory-linux.tar.gz"
          mkdir -p dist
          git archive --format=tar.gz --prefix="$directory/" -o "dist/$archive" HEAD
          (cd dist && sha256sum "$archive" > "$archive.sha256")

          smoke_dir=$(mktemp -d)
          trap 'rm -rf -- "$smoke_dir"' EXIT
          tar -xzf "dist/$archive" -C "$smoke_dir"
          cd "$smoke_dir"
          "./$directory/bin/sid2xrns" convert "./$directory/fixtures/cli-performance.sid" \
            --play-calls 6 -o smoke.xrns
          python -m zipfile -t smoke.xrns
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sid2xrns-linux
          path: dist/
          if-no-files-found: error
          compression-level: 0
